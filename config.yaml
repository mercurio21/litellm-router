# LiteLLM Proxy — единый пул провайдеров для фермы Hermes-профилей и Docker-детей.
# Admin UI: http://localhost:4000/ui, логин admin, пароль — LITELLM_MASTER_KEY из ~/.hermes/.env.
#
# 08.11.2026: ключи и модели (claude-opus/sonnet/haiku, anthropic/* фоллбэк,
# qwen3-embedding-8b) перенесены из этого файла в БД (store_model_in_db: true
# ниже) — правка через Admin UI → LLM Credentials / Models + Endpoints, не
# здесь. Перенос выполнен litellm/migrate_to_db.py из backup'а
# litellm/config.yaml.pre-db-migration-backup (там сохранена структура/история
# для справки — реальные ключи удалить после проверки переноса).
#
# ЕДИНСТВЕННАЯ вещь обязательная для Anthropic OAuth/subscription-токена на дорогих моделях
# (Sonnet/Opus; Haiku почему-то проходил и без этого) — без неё Anthropic's OAuth billing
# classifier режет запрос фейковым 429 rate_limit_error с пустым message="Error", либо честным
# 400 "Third-party apps now draw from your extra usage" (зависит от сценария, см. ниже):
#   system-промпт должен содержать строку "x-anthropic-billing-header: cc_version=X.Y.Z;
#   cc_entrypoint=cli;" — это маршрутизирует биллинг запроса в Pro/Max-подписку вместо
#   отдельного (обычно пустого) баланса "extra usage credits", который Anthropic выделяет
#   сторонним OAuth-клиентам с 2026-04-04. anthropic_oauth_identity.py (callback ниже)
#   вставляет эту строку перед system-сообщением на каждый запрос к Anthropic-моделям.
#   Подтверждено живым A/B тестом 2026-11-05 прямым curl к api.anthropic.com минуя LiteLLM:
#   с billing-header — 200, без неё — 429/400, НЕЗАВИСИМО от extra_headers (anthropic-beta/
#   user-agent/x-app протестированы с billing-header и без них — одинаковый результат что с
#   ними, что без них, поэтому они убраны из litellm_params как не влияющие на результат).
#
# ВТОРОЙ, ОТДЕЛЬНЫЙ БАГ (найден и исправлен 2026-11-05 через mitmproxy byte-for-byte
# сравнение реального трафика Hermes-ребёнка (mulahmetov) и бинарный поиск по
# комбинациям tools): Anthropic возвращает честную (не маскированную) ошибку 400
# "Third-party apps now draw from your extra usage, not your plan limits" когда в одном
# запросе одновременно присутствуют ВСЕ ТРИ инструмента с именами skill_manage,
# skill_view, skills_list — это ровно набор инструментов Hermes для управления Skills.
# Любые два из трёх — проходят нормально; любое количество/размер других инструментов —
# не при чём; не зависит от streaming/заголовков/системного промпта. Переименование
# одних этих трёх (схема и description не трогаем) полностью снимает проблему —
# Anthropic явно детектит точное совпадение этих 3 имён как попытку притвориться
# родным Skills API Claude Code у не-официального клиента.
# Фикс: anthropic_oauth_identity.py переименовывает эти 3 tool.name на выходе в
# skill_manage→hermes_skill_manage и т.п., и переименовывает обратно в ответе
# (non-streaming и streaming tool_use), так что Hermes никогда не видит подмены.

# 08.11.2026: model_list и credential_list перенесены в БД (LiteLLM_ProxyModelTable
# / LiteLLM_CredentialsTable) — см. комментарий в начале файла и
# litellm/migrate_to_db.py. Правка моделей/ключей теперь через Admin UI.

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # UI логинится как admin / master_key, когда UI_USERNAME/UI_PASSWORD не заданы.
  # Полное логирование: каждый запрос/ответ пишется в Postgres (таблица
  # LiteLLM_SpendLogs) — включая полные тела messages/prompts (не только
  # метаданные/стоимость/usage), кроме debug-уровня логов самого процесса
  # (тот регулируется LITELLM_LOG/--debug, сюда не относится).
  store_prompts_in_spend_logs: false

  store_model_in_db: true

litellm_settings:
  drop_params: true
  callbacks: anthropic_oauth_identity.proxy_handler_instance
